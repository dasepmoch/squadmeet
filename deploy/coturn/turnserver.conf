# coturn sample for Huddle (copy to /etc/turnserver.conf and fill in the CHANGE_ME values).
#
# Huddle mints short-lived credentials with the TURN REST scheme: set the same secret here
# (static-auth-secret) and in Huddle (HUDDLE_TURN_SECRET), then list the URLs in HUDDLE_ICE_URLS:
#   stun:turn.example.com:3478,turn:turn.example.com:3478?transport=udp,turns:turn.example.com:5349

listening-port=3478
tls-listening-port=5349
# Behind NAT (most clouds): public address, optionally /private address.
# external-ip=CHANGE_ME_PUBLIC_IP
realm=turn.example.com

use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET
fingerprint

# TLS for turns: (also helps on networks that only allow 443-like traffic).
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-tlsv1
no-tlsv1_1

# Relay ports (open them in the firewall, UDP).
min-port=49160
max-port=49999

# Never relay into private or special networks (no SSRF through the relay).
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Allocations: in a mesh of 8 each person has up to 7 links, one or two relays each (UDP, TLS).
user-quota=32
total-quota=4000
stale-nonce=600

no-cli
log-file=stdout
simple-log
